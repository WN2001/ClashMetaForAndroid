name: Upstream Sync

on:
  schedule:
    # 每天北京时间 10:17；避开整点拥堵，GitHub 仍可能延迟调度。
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: cmfa-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      # Fork 中 gh 可能自动选择上游；脚本也为每条命令显式指定仓库。
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream and preserve local UI changes
        run: python3 .github/scripts/auto_sync.py sync

      # 即使没有上游更新，也补偿上次 dispatch、编译或发布失败。
      - name: Ensure main has a successful or active build
        run: python3 .github/scripts/auto_sync.py ensure-build
