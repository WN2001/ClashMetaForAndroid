name: Check Automation

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test sync, conflicts and missed builds without network writes
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
